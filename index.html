<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definition-of-done checklist | MGT 3745 HW3</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Definition-of-done checklist</h1>
    <p>For each presentation section, write what "done" means. Use fictional, non-sensitive information. Sections stay in this browser profile and site only.</p>
    <form id="checklist-form" novalidate>
      <label for="section-input">Section name</label>
      <input id="section-input" name="section" type="text" maxlength="80" autocomplete="off" aria-describedby="checklist-error">

      <label for="criterion-input">Completion criterion</label>
      <input id="criterion-input" name="criterion" type="text" maxlength="200" autocomplete="off" aria-describedby="checklist-error">

      <button type="submit">Add section</button>
      <p id="checklist-error" role="alert"></p>
    </form>
    <p id="save-status" role="status" aria-live="polite"></p>
    <h2>Saved sections</h2>
    <p id="empty-state">No sections yet. Add one with a criterion that says what "done" means.</p>
    <ul id="checklist-list" aria-label="Saved sections"></ul>
  </main>
</body>
</html>
